[package]
name = "atmos67"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "HDMI Atmos bitstream to per-speaker PCM bridge for an AES67 output chain"

[dependencies]
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "format", "software-resampling"] }
# OpenJOC is not on crates.io; pinned to the commit this was tested against.
openjoc-api = { git = "https://github.com/chyinan/OpenJOC", rev = "893425751b7800632e8826d05bdef649e01faea6", default-features = false }
openjoc-scene = { git = "https://github.com/chyinan/OpenJOC", rev = "893425751b7800632e8826d05bdef649e01faea6" }
truehd = "0.7.3"
realfft = "3.5"
serde_json = "1"
# SECS 2R measures and designs the room correction. AGPL-3.0-only; atmos67
# is GPL-3.0-only and conveys the combination under GPLv3 section 13. The
# audio crate is SECS's measurement device seam, at the API's own version.
secs = { package = "sound-equalization-and-correction-system-rust-api", version = "=0.26.0" }
secs-audio = "=0.26.0"
# Dante receivers: netaudio's reverse-engineered control protocol
# (Unlicense, not on crates.io, pinned to a release tag) and the mDNS
# browser netaudio's own daemon uses, at its version.
netaudio-core = { git = "https://github.com/chris-ritsen/network-audio-controller", tag = "v0.6.1" }
mdns-sd = "=0.21.5"
