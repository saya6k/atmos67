# atmos67 defaults. The Kodi add-on writes the same settings to
# /home/osmc/.kodi/userdata/addon_data/service.atmos67/atmos67.conf, which
# takes precedence over this file.

# Speaker layout preset: 2.0 5.1 5.1.2 5.1.4 7.1 7.1.2 7.1.4 7.1.6 9.1 9.1.2
# 9.1.4 9.1.6 22.2
LAYOUT=7.1.4
# A layout file in OpenJOC JSON format; replaces LAYOUT when set.
LAYOUT_FILE=

# Network interface the PTP clock runs on.
INTERFACE=eth0
PTP_DOMAIN=0

# Multicast address of the first stream of 8 speakers; further streams count
# up from it.
ADDRESS=239.69.67.1
# Audio held back before sending, in milliseconds. Raise it if the streams
# drop out during playback.
BUFFER_MS=100
